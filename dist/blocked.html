<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Blocked - LifeFlow AI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #000;
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        max-width: 500px;
        padding: 40px;
      }
      .icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 32px;
        animation: pulse 2s ease-in-out infinite;
      }
      h1 {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 16px;
        background: linear-gradient(135deg, #DC143C, #8B5CF6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        color: #888;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        background: linear-gradient(135deg, #DC143C, #8B5CF6);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .back-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 20px rgba(220, 20, 60, 0.4);
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="icon" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="45" fill="none" stroke="url(#grad)" stroke-width="4">
          <animate attributeName="r" values="45;42;45" dur="2s" repeatCount="indefinite"/>
        </circle>
        <line x1="30" y1="30" x2="70" y2="70" stroke="#DC143C" stroke-width="6" stroke-linecap="round"/>
        <line x1="70" y1="30" x2="30" y2="70" stroke="#DC143C" stroke-width="6" stroke-linecap="round"/>
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#DC143C"/>
            <stop offset="100%" stop-color="#8B5CF6"/>
          </linearGradient>
        </defs>
      </svg>
      <h1>Site Blocked</h1>
      <p>This website is blocked during your focus session. Stay focused on your goals and come back later when your session is complete.</p>
      <button class="back-btn" onclick="window.close()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Go Back
      </button>
    </div>
  </body>
</html>
